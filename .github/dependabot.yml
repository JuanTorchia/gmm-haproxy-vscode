version: 2
updates:
  # One entry for the three manifests so a group can span them: the LSP
  # packages must move together across root, client and server or their
  # types stop matching and the unit tests fail to compile.
  - package-ecosystem: npm
    directories:
      - /
      - /client
      - /server
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore(deps)
    groups:
      vscode-lsp:
        patterns:
          - "vscode-languageclient"
          - "vscode-languageserver*"
          - "vscode-jsonrpc"
      npm-development-dependencies:
        dependency-type: development
        patterns:
          - "*"
      npm-production-dependencies:
        dependency-type: production
        patterns:
          - "*"
    ignore:
      # Keep @types/vscode aligned with engines.vscode in package.json (#31)
      - dependency-name: "@types/vscode"
      # TS 7 is unsupported by typescript-eslint 8.x; revisit on major bumps
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore(actions)
