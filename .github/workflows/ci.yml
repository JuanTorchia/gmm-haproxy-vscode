name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --legacy-peer-deps --prefix client

      - name: Install server dependencies
        run: npm ci --legacy-peer-deps --prefix server

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run compile

      # Each manifest has its own lockfile, and `npm audit` only ever looks at
      # the one it is pointed at. Auditing the root alone left client/ and
      # server/ unchecked, which is how a high-severity advisory reached
      # client/package-lock.json without CI noticing.
      - name: Security audit (root)
        run: npm audit --audit-level=high

      - name: Security audit (client)
        run: npm audit --audit-level=high --prefix client

      - name: Security audit (server)
        run: npm audit --audit-level=high --prefix server

      - name: Unit tests
        run: npm run test:unit

      - name: Build bundles
        run: npm run build

      - name: Integration tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:integration

      - name: Package extension (dry-run)
        run: npx vsce package --no-dependencies

      - name: Inspect package contents
        run: npm run package:check
