name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --legacy-peer-deps --prefix client

      - name: Install server dependencies
        run: npm ci --legacy-peer-deps --prefix server

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run compile

      # Mirrors ci.yml: npm audit only inspects the manifest it is pointed at,
      # so all three have to be checked before publishing to the Marketplace.
      - name: Security audit (root)
        run: npm audit --audit-level=high

      - name: Security audit (client)
        run: npm audit --audit-level=high --prefix client

      - name: Security audit (server)
        run: npm audit --audit-level=high --prefix server

      - name: Unit tests
        run: npm run test:unit

      - name: Build bundles
        run: npm run build

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package extension
        run: npx vsce package --no-dependencies

      - name: Inspect package contents
        run: npm run package:check

      - name: Publish to Marketplace
        run: npx vsce publish --no-dependencies --pat ${{ secrets.VSCE_PAT }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "HAProxy Config v${{ steps.version.outputs.VERSION }}" \
            --notes-file CHANGELOG.md
