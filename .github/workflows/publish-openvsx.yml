name: Publish to Open VSX

# Separate from the Marketplace workflow so an Open VSX outage never blocks a
# Marketplace release. Manual runs publish an existing tag (backfills).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.5.0)
        required: true

permissions:
  contents: read
  # OIDC token for Open VSX trusted publishing; no long-lived secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --legacy-peer-deps --prefix client
          npm ci --legacy-peer-deps --prefix server

      - name: Unit tests
        run: npm run test:unit

      - name: Package extension
        run: npx vsce package --no-dependencies --out extension.vsix

      - name: Inspect package contents
        run: npm run package:check

      - name: Publish
        run: npx --yes ovsx@1.2.0 publish --trusted-publishing --packagePath extension.vsix --skip-duplicate
