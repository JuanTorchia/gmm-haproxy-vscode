name: Publish to Open VSX

# Separate from the Marketplace workflow so an Open VSX outage never blocks a
# Marketplace release. Manual runs publish an existing tag (backfills).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.5.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Require the Open VSX token
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not configured."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --legacy-peer-deps --prefix client
          npm ci --legacy-peer-deps --prefix server

      - name: Unit tests
        run: npm run test:unit

      - name: Package extension
        run: npx vsce package --no-dependencies --out extension.vsix

      - name: Inspect package contents
        run: npm run package:check

      - name: Ensure the gmm namespace exists
        run: |
          if ! output=$(npx --yes ovsx@1.2.0 create-namespace gmm 2>&1); then
            echo "$output"
            echo "$output" | grep -qi "already exists" || exit 1
          fi

      - name: Publish
        run: npx --yes ovsx@1.2.0 publish --packagePath extension.vsix --skip-duplicate
