# ──────────────────────────────────────────────────────────────────────────────
# demo: hover.cfg
# CAPTURE INSTRUCTIONS:
#   1. Open this file
#   2. Put the cursor over the words marked <-- HOVER
#   3. Wait for the documentation tooltip
#   4. Take the screenshot showing the full hover (signature + description + sections)
#
# Good hover candidates:
#   A) "balance" → shows available algorithms and description
#   B) "option httpchk" → shows the full signature with parameters
#   C) "timeout connect" → shows the timeout format and typical values
#   D) "stick-table" → extensive, detailed documentation
# ──────────────────────────────────────────────────────────────────────────────

global
    daemon
    maxconn 50000
    log 127.0.0.1 local0

defaults
    mode http
    log global
    timeout connect 5s     # <-- HOVER over "timeout"
    timeout client  30s
    timeout server  30s

frontend web
    bind *:443 ssl crt /etc/ssl/haproxy.pem
    http-request set-header X-Real-IP %[src]   # <-- HOVER over "http-request"
    default_backend web-backend

backend web-backend
    balance leastconn       # <-- HOVER over "balance" to see algorithms
    option httpchk GET /health HTTP/1.1\r\nHost:\ example.com   # <-- HOVER over "option httpchk"
    http-check expect status 200
    stick-table type ip size 100k expire 30m    # <-- HOVER over "stick-table"
    stick on src
    server web1 10.0.0.1:8080 check inter 3s
    server web2 10.0.0.2:8080 check inter 3s
