# ──────────────────────────────────────────────────────────────────────────────
# demo: validation.cfg
# CAPTURE INSTRUCTIONS:
#   1. Open this file (make sure haproxy.version is "3.2" in settings)
#   2. Wait for the error/warning squiggles to appear
#   3. Open the Problems panel (Ctrl+Shift+M) so all of them are visible
#   4. Hover over an error to show the full message
#   5. Take the screenshot showing the code + Problems panel
#
# Expected errors and warnings:
#   - Line 30: 'option httpclose' → deprecated → WARNING with quick fix
#   - Line 35: 'reqrep' → removed in 2.1 → ERROR with migration hint
#   - Line 42: 'use_backend mobile-backend' → undefined backend → WARNING
#   - Line 44: invalid timeout value → ERROR
# ──────────────────────────────────────────────────────────────────────────────

global
    daemon
    maxconn 20000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend legacy-app
    bind *:80
    # deprecated since HAProxy 1.5 — the extension offers a quick fix
    option httpclose
    default_backend app-backend

backend app-backend
    # reqrep was removed in HAProxy 2.1
    reqrep ^Host:\ www\.example\.com  Host:\ example.com
    balance roundrobin
    server app1 10.0.0.1:8080 check

frontend router
    bind *:8080
    # backend referenced but never defined
    use_backend mobile-backend if { path_beg /mobile }
    # timeout with an invalid format
    timeout client 999x
    default_backend app-backend
