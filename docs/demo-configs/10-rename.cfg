# -----------------------------------------------------------------------------
# demo: rename.cfg
# CAPTURE INSTRUCTIONS:
#   1. Open this file with haproxy.version set to "3.2".
#   2. Put the cursor on "api-v1" in the "backend api-v1" header. Document
#      highlight marks the definition and its three references.
#   3. Press F2, type "api-v2" and press Enter.
#   4. Capture the frames before, during and after the rename for the README
#      rename demo (docs/images/10-rename-*.png).
#   5. Press Shift+F12 on "api-v2" for docs/images/11-references.png.
#   6. Open Explorer > Outline (collapse the folders view so the tree has room)
#      for docs/images/12-outline.png.
#
# Expected result:
#   - The backend header, both use_backend lines and the default_backend line
#     are renamed in one edit. No other text changes.
#
# Keep this file intentionally small and free of diagnostics so the capture
# shows only the rename. Addresses use the 192.0.2.0/24 documentation range.
# -----------------------------------------------------------------------------

global
    daemon
    maxconn 10000

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend public-http
    bind *:80
    acl is_api path_beg /api
    use_backend api-v1 if is_api
    default_backend web-backend

frontend internal-http
    bind *:8080
    acl is_api path_beg /api
    use_backend api-v1 if is_api
    default_backend api-v1

backend api-v1
    balance roundrobin
    option httpchk GET /health
    server api1 192.0.2.20:3000 check
    server api2 192.0.2.21:3000 check

backend web-backend
    balance roundrobin
    server web1 192.0.2.10:8080 check
