# ──────────────────────────────────────────────────────────────────────────────
# demo: completion.cfg
# CAPTURE INSTRUCTIONS:
#   1. Open this file
#   2. Place the cursor at the end of a line marked <-- CURSOR
#   3. Type a space or the first letter to trigger completion
#   4. Record the GIF showing the suggestion list
#
# Three good moments to show:
#   A) Inside backend — type "ba" and balance, etc. appear
#   B) Inside frontend — type "http" and http-request, etc. appear
#   C) Delete "roundrobin" from the balance line and press Ctrl+Space — the
#      algorithms appear (roundrobin, leastconn…). The file has no errors
#      until edited: a "balance" without an algorithm is a real error.
# ──────────────────────────────────────────────────────────────────────────────

global
    daemon
    maxconn 50000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend api-gateway
    bind *:80
    bind *:443 ssl crt /etc/ssl/haproxy.pem
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    # <-- CURSOR: type "http" here to see http-request completion
    default_backend api-backend

backend api-backend
    # <-- CURSOR: type "ba" here to see directive suggestions
    balance roundrobin
    # <-- CURSOR: delete "roundrobin" and press Ctrl+Space to see algorithms
    option httpchk GET /ping
    server api1 10.0.1.10:3000 check
    server api2 10.0.1.11:3000 check
