# ──────────────────────────────────────────────────────────────────────────────

global
    daemon
    maxconn 20000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

backend legacy-backend
    # deprecated: the extension suggests replacing it with "option http-server-close"
    option httpclose
    balance roundrobin
    server app1 10.0.0.1:8080 check

backend another-legacy
    # deprecated: also has a quick fix
    option forceclose
    balance leastconn
    server app2 10.0.0.2:8080 check
    server app3 10.0.0.3:8080 check
