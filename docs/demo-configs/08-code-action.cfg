#   2. Wait for the deprecation warnings on the marked lines
#   3. Put the cursor on "option httpclose" (line 26)
#   4. Click the lightbulb or press Ctrl+. to see Quick Fixes
#   5. Select "Replace 'option httpclose' with 'option http-server-close'"
